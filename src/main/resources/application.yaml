spring:
  application:
    name: langfuse
  config:
    # lokalne sekrety (OPENAI_API_KEY, LANGFUSE_AUTH) - plik poza gitem, patrz .env.example
    import: optional:file:.env[.properties]
  datasource:
    # "produkcyjna" baza wydatków: H2 w pliku, przeżywa restarty (AUTO_SERVER - aplikacja i evale mogą działać naraz);
    # eval na snapshocie podmienia ją na świeżą bazę w pamięci
    url: jdbc:h2:file:./budget-db/data/budget;AUTO_SERVER=TRUE
    username: sa
  sql:
    init:
      mode: always
      schema-locations: file:budget-db/init.sql
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: gpt-4o-mini
        temperature: 0.0
    tools:
      observations:
        # argumenty i wynik wywołań narzędzi trafiają do spanów
        include-content: true

langfuse:
  base-url: http://localhost:3000

management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${langfuse.base-url}/api/public/otel/v1/traces
          headers:
            # LANGFUSE_AUTH = base64("<public-key>:<secret-key>")
            Authorization: Basic ${LANGFUSE_AUTH}
  otlp:
    metrics:
      export:
        # Langfuse przyjmuje tylko trace'y
        enabled: false
