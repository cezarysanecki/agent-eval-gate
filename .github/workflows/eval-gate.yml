# Bramka evala w CI: ten sam test co .githooks/pre-push, wyniki trafiają do Langfuse Cloud.
# Sekrety repozytorium: OPENAI_API_KEY, LANGFUSE_AUTH = base64("<public-key>:<secret-key>").
# Zmienna repozytorium: LANGFUSE_BASE_URL, np. https://cloud.langfuse.com
name: Bramka evala

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 27
          cache: gradle
      - name: Eval promptu produkcyjnego
        run: ./gradlew gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGFUSE_AUTH: ${{ secrets.LANGFUSE_AUTH }}
          LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
